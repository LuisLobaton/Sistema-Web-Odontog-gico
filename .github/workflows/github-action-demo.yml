name: Github Actions Demo

run-name: ${{ github.actor }} esta ejecutando un pipeline

on:
  push:

jobs:
  Saludar-Hello-World:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Este job ha sido ejecutado por un evento ${{ github.event_name }}"
      - run: echo "El nombre de la rama es ${{ github.ref }} y el repositorio es ${{ github.repository }}"
      
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Listar los archivos del repositorio
        run: |
          ls ${{ github.workspace }}
          
      - name: Hello Terraform
        run: terraform --version
        
      - name: Hello Ansible
        run: ansible --version
        
      - name: Hello AWS CLI
        run: aws --version