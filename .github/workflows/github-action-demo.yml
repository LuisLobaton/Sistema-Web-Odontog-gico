name: GitHub Actions Workflow LuisLobaton

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-test:
    name: Validar e Imprimir Entorno
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Imprimir Variables de Entorno de LuisLobaton
        env:
          REGION: ${{ vars.AWS_REGION }}
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          echo "=========================================="
          echo "REPOSITORIO: LuisLobaton/Sistema-Web-Odontog-gico"
          echo "REGION CONFIGURADA: $REGION"
          echo "ROLE ARN CONFIGURADO: $ROLE"
          echo "S3 STATE BUCKET: $BUCKET"
          echo "=========================================="

      - name: Terraform Init (Modo Inicial)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate