name: GitHub Actions Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Saludar-Hello-World:
    runs-on: ubuntu-latest
    steps:
      - name: Mensaje de inicio
        run: echo "Este job ha sido ejecutado por ${{ github.event_name }}"

      - name: Informacion de la rama y repositorio
        run: echo "El nombre de la rama es ${{ github.ref }} y el repositorio es ${{ github.repository }}"

      # Correccion del error del profesor: se usa v4 en lugar de v6
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Listar los archivos del repositorio
        run: |
          ls ${{ github.workspace }}

      # Prueba de ejecucion de la variable configurada
      - name: Probar variable AWS_ROLE_ARN
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          echo "El rol configurado es: $ROLE_ARN"